_schema-version: 3.3.0
ID: hanamorph
version: 1.0.0
description: "CDS &amp; Calculation View to Datasphere Migration Tool"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node scripts/copy-app.js
modules:
  - name: hanamorph-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      []

resources:
  []
