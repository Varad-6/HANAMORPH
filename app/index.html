<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanaMorph | Datasphere Migration Tool</title>
    <!-- SAPUI5 Bootstrap with SAP Horizon Theme -->
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.ui.layout, sap.f"
        data-sap-ui-resourceroots='{"hanamorph": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatversion="edge"
        data-sap-ui-async="true">
    </script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: "72", Arial, sans-serif; background-color: #f5f6f7; }
        .text-muted { color: #64748b; font-style: italic; }
    </style>
</head>
<body class="sapUiBody" id="content">
    <div data-sap-ui-component
        data-name="hanamorph"
        data-id="container"
        data-settings='{"id" : "hanamorph"}'
        style="height: 100%">
    </div>
</body>
</html>
