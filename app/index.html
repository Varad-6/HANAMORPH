<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanaMorph | CDS & Calculation View to Datasphere Migration Cockpit</title>
    <!-- SAPUI5 Bootstrap with SAP Horizon Theme -->
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.ui.layout, sap.ui.unified, sap.tnt"
        data-sap-ui-resourceroots='{"hanamorph": "./"}'
        data-sap-ui-compatversion="edge"
        data-sap-ui-async="true">
    </script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: "72", Arial, sans-serif; background-color: #f5f6f7; }
        .log-box { font-family: 'Consolas', 'Courier New', monospace; background: #181c24; color: #a5b4fc; padding: 14px; border-radius: 8px; max-height: 240px; overflow-y: auto; font-size: 12px; line-height: 1.5; border: 1px solid #312e81; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #f87171; font-weight: bold; }
        .code-box { font-family: 'Consolas', 'Courier New', monospace; background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; max-height: 380px; overflow-y: auto; border: 1px solid #334155; }
        .metric-badge { font-weight: bold; padding: 6px 12px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body class="sapUiBody" id="content">
    <script>
        sap.ui.getCore().attachInit(function () {
            const oModel = new sap.ui.model.json.JSONModel({
                allViews: [],
                filteredViews: [],
                selectedView: null,
                selectedTab: 'CDS',
                cdsCount: 0,
                calcCount: 0,
                targetSpace: 'PURCHASING_ANALYTICS',
                targetViewName: '',
                artifacts: [],
                activeJob: null,
                jobLogs: [],
                isMigrating: false
            });
            sap.ui.getCore().setModel(oModel);

            function loadViews() {
                fetch('/odata/v4/migration/SourceCatalog')
                    .then(res => res.json())
                    .then(data => {
                        const views = data.value || [];
                        oModel.setProperty('/allViews', views);
                        
                        const cdsViews = views.filter(v => v.type === 'CDS');
                        const calcViews = views.filter(v => v.type === 'CALC_VIEW');
                        oModel.setProperty('/cdsCount', cdsViews.length);
                        oModel.setProperty('/calcCount', calcViews.length);

                        filterListByTab(oModel.getProperty('/selectedTab'));
                    })
                    .catch(err => sap.m.MessageToast.show("Error loading views: " + err));
            }

            function filterListByTab(tabKey) {
                oModel.setProperty('/selectedTab', tabKey);
                const all = oModel.getProperty('/allViews') || [];
                const filtered = all.filter(v => v.type === tabKey);
                oModel.setProperty('/filteredViews', filtered);

                if (filtered.length > 0) {
                    selectView(filtered[0]);
                } else {
                    oModel.setProperty('/selectedView', null);
                    oModel.setProperty('/artifacts', []);
                }
            }

            function selectView(view) {
                if (!view) return;
                oModel.setProperty('/selectedView', view);
                oModel.setProperty('/targetViewName', `${view.name}_DS`);

                fetch(`/odata/v4/migration/getArtifacts(viewName='${encodeURIComponent(view.name)}')`)
                    .then(res => res.json())
                    .then(data => {
                        oModel.setProperty('/artifacts', data.value || []);
                    });
            }

            function triggerMigration() {
                const view = oModel.getProperty('/selectedView');
                if (!view) return;

                oModel.setProperty('/isMigrating', true);
                oModel.setProperty('/activeJob', { status: 'PENDING', progress: 5 });
                oModel.setProperty('/jobLogs', []);

                fetch('/odata/v4/migration/triggerMigration', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sourceViewName: view.name,
                        sourceViewType: view.type,
                        targetSpace: oModel.getProperty('/targetSpace'),
                        targetViewName: oModel.getProperty('/targetViewName')
                    })
                })
                .then(res => res.json())
                .then(job => {
                    pollJob(job.ID);
                })
                .catch(err => {
                    sap.m.MessageBox.error("Migration request failed: " + err);
                    oModel.setProperty('/isMigrating', false);
                });
            }

            function pollJob(jobId) {
                const interval = setInterval(() => {
                    Promise.all([
                        fetch(`/odata/v4/migration/MigrationJobs(${jobId})`).then(r => r.json()),
                        fetch(`/odata/v4/migration/JobLogs?$filter=job_ID eq ${jobId}&$orderby=timestamp asc`).then(r => r.json())
                    ]).then(([job, logs]) => {
                        oModel.setProperty('/activeJob', job);
                        oModel.setProperty('/jobLogs', logs.value || []);

                        if (job.status === 'COMPLETED' || job.status === 'FAILED') {
                            clearInterval(interval);
                            oModel.setProperty('/isMigrating', false);
                            if (job.status === 'COMPLETED') {
                                sap.m.MessageToast.show(`✓ Migration finished for ${job.targetViewName}!`);
                            } else {
                                sap.m.MessageBox.error(`Migration failed: ${job.errorMessage}`);
                            }
                        }
                    });
                }, 500);
            }

            function openArtifactDetail(artifact) {
                const oDialog = new sap.m.Dialog({
                    title: `${artifact.artifactType}: ${artifact.name}`,
                    contentWidth: "750px",
                    contentHeight: "450px",
                    content: [
                        new sap.m.VBox({
                            class: "sapUiMediumMargin",
                            items: [
                                new sap.m.Text({ text: `Columns: ${artifact.columnCount} | Target View: ${artifact.viewName}` }).addStyleClass("sapUiSmallMarginBottom"),
                                new sap.ui.core.HTML({
                                    content: `<pre class="code-box">${escapeHtml(artifact.details)}</pre>`
                                })
                            ]
                        })
                    ],
                    beginButton: new sap.m.Button({
                        text: "Close",
                        press: function () { oDialog.close(); }
                    }),
                    afterClose: function () { oDialog.destroy(); }
                });
                oDialog.open();
            }

            function escapeHtml(text) {
                return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // Main Shell & Page
            const oPage = new sap.m.Page({
                title: "HanaMorph Migration Cockpit",
                showNavButton: false,
                headerContent: [
                    new sap.m.ObjectStatus({
                        text: "S/4HANA & Datasphere Active",
                        state: "Success",
                        icon: "sap-icon://connected"
                    }),
                    new sap.m.Button({
                        text: "Sync Source Views",
                        icon: "sap-icon://synchronize",
                        type: "Emphasized",
                        press: function () {
                            sap.m.MessageToast.show("Discovering ABAP CDS Views and HANA Calculation Views...");
                            fetch('/odata/v4/migration/importCatalog', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ sourceType: 'ALL' })
                            }).then(() => loadViews());
                        }
                    })
                ],
                content: [
                    new sap.ui.layout.Splitter({
                        height: "calc(100vh - 48px)",
                        contentAreas: [
                            // LEFT SIDEBAR: VIEW DISCOVERY
                            new sap.m.VBox({
                                width: "420px",
                                items: [
                                    new sap.m.IconTabBar({
                                        select: function (oEvent) {
                                            filterListByTab(oEvent.getParameter("key"));
                                        },
                                        items: [
                                            new sap.m.IconTabFilter({
                                                key: "CDS",
                                                text: "{= 'CDS Views (' + ${/cdsCount} + ')' }",
                                                icon: "sap-icon://source-code"
                                            }),
                                            new sap.m.IconTabFilter({
                                                key: "CALC_VIEW",
                                                text: "{= 'Calculation Views (' + ${/calcCount} + ')' }",
                                                icon: "sap-icon://dimension"
                                            })
                                        ]
                                    }),
                                    new sap.m.SearchField({
                                        placeholder: "Search views or descriptions...",
                                        liveChange: function (oEvent) {
                                            const sVal = oEvent.getParameter("newValue")?.toLowerCase() || '';
                                            const all = oModel.getProperty('/allViews') || [];
                                            const currentTab = oModel.getProperty('/selectedTab');
                                            const filtered = all.filter(v => v.type === currentTab && (v.name.toLowerCase().includes(sVal) || v.description.toLowerCase().includes(sVal)));
                                            oModel.setProperty('/filteredViews', filtered);
                                        }
                                    }),
                                    new sap.m.List({
                                        mode: "SingleSelectMaster",
                                        selectionChange: function (oEvent) {
                                            const item = oEvent.getParameter("listItem").getBindingContext().getObject();
                                            selectView(item);
                                        },
                                        items: {
                                            path: "/filteredViews",
                                            template: new sap.m.StandardListItem({
                                                title: "{name}",
                                                description: "{description}",
                                                info: "{= ${columnCount} + ' cols' }",
                                                icon: "{= ${type} === 'CDS' ? 'sap-icon://source-code' : 'sap-icon://dimension' }"
                                            })
                                        }
                                    })
                                ]
                            }),

                            // RIGHT MAIN WORKSPACE
                            new sap.m.ScrollContainer({
                                height: "100%",
                                vertical: true,
                                content: [
                                    new sap.m.VBox({
                                        class: "sapUiMediumMargin",
                                        items: [
                                            // PANEL 1: SOURCE VIEW SUMMARY
                                            new sap.m.Panel({
                                                headerText: "Source View Overview",
                                                expandable: false,
                                                content: [
                                                    new sap.ui.layout.form.SimpleForm({
                                                        layout: "ResponsiveGridLayout",
                                                        editable: false,
                                                        content: [
                                                            new sap.m.Label({ text: "View Name" }),
                                                            new sap.m.Text({ text: "{/selectedView/name}" }),
                                                            new sap.m.Label({ text: "View Category" }),
                                                            new sap.m.Text({ text: "{= ${/selectedView/type} === 'CDS' ? 'ABAP Core Data Services (CDS)' : 'HANA Calculation View (Analytical Cube)' }" }),
                                                            new sap.m.Label({ text: "HANA SQL Identifier" }),
                                                            new sap.m.Text({ text: "{/selectedView/sqlViewName}" }),
                                                            new sap.m.Label({ text: "Package / Schema" }),
                                                            new sap.m.Text({ text: "{/selectedView/packageOrSchema}" }),
                                                            new sap.m.Label({ text: "Compatibility" }),
                                                            new sap.m.ObjectStatus({ text: "{/selectedView/supportedStatus}", state: "Success", icon: "sap-icon://accept" })
                                                        ]
                                                    })
                                                ]
                                            }),

                                            // PANEL 2: ARTIFACT SELECTION & DRILLDOWN
                                            new sap.m.Panel({
                                                headerText: "Source Artifacts (Graphical / Table / SQL)",
                                                content: [
                                                    new sap.m.Table({
                                                        columns: [
                                                            new sap.m.Column({ header: new sap.m.Text({ text: "Type" }), width: "130px" }),
                                                            new sap.m.Column({ header: new sap.m.Text({ text: "Artifact Name" }), width: "260px" }),
                                                            new sap.m.Column({ header: new sap.m.Text({ text: "Columns" }), width: "90px" }),
                                                            new sap.m.Column({ header: new sap.m.Text({ text: "Details" }) }),
                                                            new sap.m.Column({ header: new sap.m.Text({ text: "Inspect" }), width: "90px" })
                                                        ],
                                                        items: {
                                                            path: "/artifacts",
                                                            template: new sap.m.ColumnListItem({
                                                                cells: [
                                                                    new sap.m.ObjectStatus({
                                                                        text: "{artifactType}",
                                                                        state: "{= ${artifactType} === 'SQL' ? 'Information' : (${artifactType} === 'TABLE' ? 'Warning' : 'Success') }"
                                                                    }),
                                                                    new sap.m.Text({ text: "{name}", wrapping: false }),
                                                                    new sap.m.Text({ text: "{columnCount}" }),
                                                                    new sap.m.Text({ text: "{details}", maxLines: 1 }),
                                                                    new sap.m.Button({
                                                                        text: "View",
                                                                        icon: "sap-icon://inspect",
                                                                        press: function (oEvent) {
                                                                            const art = oEvent.getSource().getBindingContext().getObject();
                                                                            openArtifactDetail(art);
                                                                        }
                                                                    })
                                                                ]
                                                            })
                                                        }
                                                    })
                                                ]
                                            }),

                                            // PANEL 3: TARGET DATASPHERE DESTINATION & TRANSFER
                                            new sap.m.Panel({
                                                headerText: "Target Datasphere Configuration & One-Click Rebuild",
                                                content: [
                                                    new sap.ui.layout.form.SimpleForm({
                                                        layout: "ResponsiveGridLayout",
                                                        content: [
                                                            new sap.m.Label({ text: "Target Space" }),
                                                            new sap.m.Input({ value: "{/targetSpace}" }),
                                                            new sap.m.Label({ text: "Target View Name" }),
                                                            new sap.m.Input({ value: "{/targetViewName}" }),
                                                            new sap.m.Label({ text: "Transfer Action" }),
                                                            new sap.m.Button({
                                                                text: "Rebuild & Load in Datasphere",
                                                                icon: "sap-icon://upload-to-cloud",
                                                                type: "Emphasized",
                                                                enabled: "{= !${/isMigrating} && !!${/selectedView} }",
                                                                press: triggerMigration
                                                            })
                                                        ]
                                                    })
                                                ]
                                            }),

                                            // PANEL 4: MIGRATION PIPELINE STATUS & LOGS
                                            new sap.m.Panel({
                                                headerText: "Migration Pipeline & Run Status",
                                                visible: "{= !!${/activeJob} }",
                                                content: [
                                                    new sap.m.ProgressIndicator({
                                                        percentValue: "{/activeJob/progress}",
                                                        displayValue: "{/activeJob/status} ({/activeJob/progress}%)",
                                                        state: "{= ${/activeJob/status} === 'FAILED' ? 'Error' : (${/activeJob/status} === 'COMPLETED' ? 'Success' : 'Information') }"
                                                    }),

                                                    // Validation Parity Badge
                                                    new sap.m.HBox({
                                                        visible: "{= ${/activeJob/status} === 'COMPLETED' }",
                                                        alignItems: "Center",
                                                        class: "sapUiSmallMarginTop",
                                                        items: [
                                                            new sap.m.ObjectStatus({
                                                                text: "{= '✓ Parity Verified: ' + ${/activeJob/targetRowCount} + ' records matched between Source & Datasphere' }",
                                                                state: "Success",
                                                                icon: "sap-icon://sys-enter-2"
                                                            }).addStyleClass("metric-badge")
                                                        ]
                                                    }),

                                                    new sap.m.Title({ text: "Pipeline Execution Log Stream", level: "H5" }).addStyleClass("sapUiSmallMarginTop"),
                                                    new sap.m.List({
                                                        items: {
                                                            path: "/jobLogs",
                                                            template: new sap.m.StandardListItem({
                                                                title: "{message}",
                                                                info: "{level}",
                                                                description: "{timestamp}",
                                                                icon: "{= ${level} === 'ERROR' ? 'sap-icon://error' : (${level} === 'WARN' ? 'sap-icon://alert' : 'sap-icon://sys-enter-2') }"
                                                            })
                                                        }
                                                    }),

                                                    // Post-Migration Actions
                                                    new sap.m.HBox({
                                                        visible: "{= ${/activeJob/status} === 'COMPLETED' }",
                                                        class: "sapUiSmallMarginTop",
                                                        items: [
                                                            new sap.m.Button({
                                                                text: "Download CSN JSON",
                                                                icon: "sap-icon://download",
                                                                type: "Default",
                                                                press: function() {
                                                                    const csn = oModel.getProperty('/activeJob/csnPayload');
                                                                    const blob = new Blob([csn], { type: 'application/json' });
                                                                    const url = URL.createObjectURL(blob);
                                                                    const a = document.createElement('a');
                                                                    a.href = url;
                                                                    a.download = `${oModel.getProperty('/activeJob/targetViewName')}.csn.json`;
                                                                    a.click();
                                                                }
                                                            }),
                                                            new sap.m.Button({
                                                                text: "View Target SQL",
                                                                icon: "sap-icon://source-code",
                                                                class: "sapUiSmallMarginBegin",
                                                                press: function() {
                                                                    const sql = oModel.getProperty('/activeJob/generatedSql');
                                                                    const oSqlDialog = new sap.m.Dialog({
                                                                        title: "Datasphere SQL View Definition",
                                                                        contentWidth: "700px",
                                                                        content: [
                                                                            new sap.ui.core.HTML({
                                                                                content: `<pre class="code-box">${escapeHtml(sql)}</pre>`
                                                                            })
                                                                        ],
                                                                        beginButton: new sap.m.Button({ text: "Close", press: () => oSqlDialog.close() }),
                                                                        afterClose: () => oSqlDialog.destroy()
                                                                    });
                                                                    oSqlDialog.open();
                                                                }
                                                            })
                                                        ]
                                                    })
                                                ]
                                            })
                                        ]
                                    })
                                ]
                            })
                        ]
                    })
                ]
            });

            oPage.placeAt("content");
            loadViews();
        });
    </script>
</body>
</html>
